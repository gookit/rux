# CodeQL configuration for gookit/rux.
#
# `_benchmarks/` holds comparison fixtures that run the same route on chi, gin,
# gorilla/mux, httprouter, muxie, fasthttp and rux. Those handlers deliberately
# echo a path parameter (for example `w.Write([]byte(chi.URLParam(r, "id")))`) so
# the router work is not optimized away, and the fixtures already set
# `Content-Type: text/plain` plus `X-Content-Type-Options: nosniff` at runtime.
#
# The reflected-XSS query models `chi.URLParam` / `mux.Vars` as request sources
# and any in-repo `http.ResponseWriter` implementation (rux's response writer) as
# the sink, so it reports those fixtures even though they are not shipped code.
# They are excluded here rather than escaped: escaping only the flagged files
# would make the published router comparison unfair.
paths-ignore:
  - _benchmarks/**
